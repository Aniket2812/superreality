# One-command local Super Realty stack with CockroachDB as its memory layer.
services:
  db:
    image: cockroachdb/cockroach:v25.4.0
    command:
      - start-single-node
      - --insecure
      - --advertise-addr=db
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
    volumes:
      - cockroachdata:/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8081:8080" # CockroachDB Console
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute=SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    restart: unless-stopped

  backend:
    build: ./backend
    image: realtyrecall-backend
    env_file: .env
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://root@db:26257/defaultdb?sslmode=disable}
      LIVEKIT_URL: ${PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      WEB_CONCURRENCY: "1"
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  agent:
    build: ./agent
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
    depends_on:
      backend:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TOKEN_ENDPOINT: ${VITE_TOKEN_ENDPOINT:-http://localhost:8000/api/v1/token}
        VITE_AGENT_NAME: ${VITE_AGENT_NAME:-realty}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

  seed:
    image: realtyrecall-backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://root@db:26257/defaultdb?sslmode=disable}
    command: ["python", "-m", "src.scripts.seed_demo"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["seed"]

volumes:
  cockroachdata:
